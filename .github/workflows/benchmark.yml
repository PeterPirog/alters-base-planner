name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - representative

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Run benchmark suite
        run: >-
          python -m alters_base_planner.benchmark
          --suite "${{ inputs.suite }}"
          --json benchmark-artifacts/benchmark-results.json
          --markdown benchmark-artifacts/benchmark-results.md
      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ inputs.suite }}-${{ github.run_id }}
          path: benchmark-artifacts/
          if-no-files-found: error
          retention-days: 30
