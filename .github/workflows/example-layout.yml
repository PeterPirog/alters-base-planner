name: Generate optimized example layout

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/example-plan.json"
      - ".github/workflows/example-layout.yml"
  push:
    branches: [main]
    paths:
      - "config/example-plan.json"
      - "config/plan.json"
      - "src/**"
      - ".github/workflows/example-layout.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install planner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run optimizer
        run: python -m alters_base_planner.cli config/example-plan.json
      - name: Verify generated outputs
        run: |
          test -s layout.png
          test -s layout.svg
          test -s layout.json
          python - <<'PY'
          import json
          data = json.load(open('layout.json', encoding='utf-8'))
          assert data['status'] == 'FEASIBLE', data['status']
          print('objective=', data['optimization']['weighted_distance_score'])
          print('average_pair_distance=', data['optimization']['average_pair_distance'])
          print('weighted_average_pair_distance=', data['optimization']['weighted_average_pair_distance'])
          print('total_base_mass=', data['journey']['total_base_mass'])
          print('organics_required=', data['journey']['organics_required'])
          print('global_objective_optimum_proven=', data['optimization']['global_objective_optimum_proven'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: optimized-layout
          path: |
            layout.png
            layout.svg
            layout.json
          if-no-files-found: error
