name: Generate optimized example layout

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/example-plan.json"
      - "src/**"
      - "scripts/create_example_evidence.py"
      - "tests/**"
      - "pyproject.toml"
      - "docs/BENCHMARKS.md"
      - ".github/workflows/example-layout.yml"
  push:
    branches: [main]
    paths:
      - "config/example-plan.json"
      - "config/plan.json"
      - "src/**"
      - "scripts/create_example_evidence.py"
      - "tests/**"
      - "pyproject.toml"
      - "docs/BENCHMARKS.md"
      - ".github/workflows/example-layout.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install planner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run optimizer
        id: optimizer
        run: |
          exit_code=0
          python -m alters_base_planner.cli config/example-plan.json || exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
      - name: Create evidence package
        if: always()
        env:
          OPTIMIZER_EXIT_CODE: ${{ steps.optimizer.outputs.exit_code }}
        run: python scripts/create_example_evidence.py
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-plan-evidence
          path: example-plan-*.zip
          if-no-files-found: error
      - name: Enforce example baseline acceptance
        if: always()
        run: python scripts/create_example_evidence.py --verify
