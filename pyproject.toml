[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "alters-base-planner"
version = "0.1.0"
description = "Optimization-based base layout planner for The Alters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ortools>=9.11",
  "pydantic>=2.9",
  "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
alters-base-planner = "alters_base_planner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alters_base_planner"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
